name: nix-vendor-hash

on:
  pull_request_target:
    paths:
      - "go.mod"
      - "go.sum"
      - "flake.nix"

jobs:
  build:
    name: Validate and update Nix vendorHash
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      updated: ${{ steps.vendor-hash.outputs.updated }}
      hash: ${{ steps.vendor-hash.outputs.hash }}

    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Update and validate vendorHash
        id: vendor-hash
        shell: bash
        run: |
          set -euo pipefail

          build_log="$(mktemp)"
          if nix build .#aws-sso-creds >"$build_log" 2>&1; then
            echo "updated=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          if ! grep -q "hash mismatch in fixed-output derivation" "$build_log"; then
            cat "$build_log"
            exit 1
          fi

          new_hash="$(sed -n 's/.*got:[[:space:]]*\(sha256-[A-Za-z0-9+/=]*\).*/\1/p' "$build_log" | head -n1)"
          if [[ -z "$new_hash" ]]; then
            cat "$build_log"
            exit 1
          fi

          sed -i "s|vendorHash = \".*\";|vendorHash = \"$new_hash\";|" flake.nix
          nix build .#aws-sso-creds

          echo "updated=true" >>"$GITHUB_OUTPUT"
          echo "hash=$new_hash" >>"$GITHUB_OUTPUT"

      - name: Upload corrected flake
        if: steps.vendor-hash.outputs.updated == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: corrected-flake
          path: flake.nix

  push:
    name: Push corrected vendorHash
    needs: build
    if: >-
      needs.build.outputs.updated == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Download corrected flake
        uses: actions/download-artifact@v8
        with:
          name: corrected-flake
          path: corrected

      - name: Commit and push vendorHash
        shell: bash
        run: |
          set -euo pipefail

          cp corrected/flake.nix flake.nix
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.nix
          git commit -m "ci: refresh nix vendorHash"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
